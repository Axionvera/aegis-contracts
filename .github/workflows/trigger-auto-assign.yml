name: Trigger Auto Assign

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  trigger-auto-assign:
    name: Trigger central auto-assign
    runs-on: ubuntu-latest

    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}

    steps:
      - name: Trigger automation repo
        env:
          GH_TOKEN: ${{ secrets.AXIONVERA_AUTOMATION_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Axionvera/pocketpay-issue-automation/dispatches \
            -f event_type=axionvera-issue-application \
            -F client_payload[repo]="${{ github.repository }}" \
            -F client_payload[issue_number]="${{ github.event.issue.number }}" \
            -F client_payload[applicant]="${{ github.event.comment.user.login }}"